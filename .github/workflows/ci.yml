name: CI

# Runs the host tests with code coverage on every push and pull request.
# Device tests (androidDeviceTest) need an emulator and are not run here.

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run host tests with coverage
        run: ./gradlew :shared:koverXmlReport :shared:koverHtmlReport --console=plain

      - name: Coverage summary
        if: always()
        run: |
          REPORT=shared/build/reports/kover/report.xml
          if [ ! -f "$REPORT" ]; then
            echo "No coverage report (tests failed?)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/coverage-summary.py "$REPORT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: shared/build/reports/kover/html/
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
